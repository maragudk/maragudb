name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  lint:
    uses: maragudk/workflows/.github/workflows/lint.yml@main

  test:
    uses: maragudk/workflows/.github/workflows/test.yml@main
    with:
      postgres: true
      secret-env: AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ENDPOINT_URL_S3 AWS_REGION BUCKET
    secrets: inherit
